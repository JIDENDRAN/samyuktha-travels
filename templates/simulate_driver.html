<!DOCTYPE html>
<html>
<head>
  <title>Driver Simulator</title>
</head>
<body>
  <h2>Driver Simulator</h2>
  Trip ID: <input type="number" id="trip_id" value="1"><br><br>
  <button onclick="start()">Start Sending Location</button>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io("{{ realtime_socket_url }}");

    function start() {
      const trip_id = parseInt(document.getElementById("trip_id").value);
      let lat = 12.9716, lng = 77.5946;

      setInterval(() => {
        lat += (Math.random() - 0.5) * 0.01;
        lng += (Math.random() - 0.5) * 0.01;
        socket.emit("driver_location", { trip_id, lat, lng });
      }, 2000);
    }
  </script>
</body>
</html>
