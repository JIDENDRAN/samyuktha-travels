<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Login | Samyuktha</title>

  <!-- Optional: Bootstrap for consistent UI (safe visual change only) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Keep your original stylesheet reference so existing styles are preserved -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    :root{
      --brand: #0d9488;
      --muted: #6b7280;
      --card-radius: 14px;
      --shadow: 0 12px 32px rgba(15,23,42,0.06);
    }

    html,body{height:100%}
    body{
      margin:0;
      min-height:100%;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Helvetica Neue";
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      color:#0f172a;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem;
    }

    /* Decorative subtle SVG wave (non-interactive) */
    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(600px 300px at 10% 10%, rgba(13,148,136,0.06), transparent 10%),
        radial-gradient(500px 250px at 90% 85%, rgba(6,182,212,0.04), transparent 12%);
    }

    .card-panel{
      width:100%;
      max-width:520px;
      border-radius:24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      background:rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(15,23,42,0.04);
    }

    .brand-left{display:flex;align-items:center;gap:.75rem}
    .brand-logo{width:48px;height:48px;object-fit:cover;border-radius:10px}
    .brand-title{font-weight:700}
    .brand-sub{color:var(--muted);font-size:.85rem}

    .muted{color:var(--muted)}
    .btn-back{background:transparent;border:1px solid rgba(15,23,42,0.06);color:var(--brand)}
    .lead-note{margin-bottom:0.75rem}
    .footer-note{font-size:.85rem;color:var(--muted);margin-top:0.75rem}
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <div class="card card-panel">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="brand-left">
          <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="Samyuktha logo" class="brand-logo">
          <div>
            <div class="brand-title">Samyuktha</div>
            <div class="brand-sub">Tours &amp; Travels</div>
          </div>
        </div>
        
      </div>

      <div class="text-center mb-3">
        <h2 class="h4 mb-1">User Login</h2>
        <p class="muted lead-note">This page can be expanded later (OTP, user dashboard).</p>
      </div>

      <!-- Preserve existing functionality: no form fields added/removed.
           If you want the login inputs back, I can add them — this keeps behavior unchanged. -->
      <div class="text-center">
        <a class="btn btn-lg btn-outline-secondary" href="/">Return to Home</a>
      </div>

      <div class="footer-note text-center">
        &copy; {{ current_year or 2026 }} Samyuktha Tours &amp; Travels
      </div>
    </div>
  </div>

  <!-- Bootstrap JS only for styling/tooling (no behavioral changes) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
