<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Samyutha Travels | Best Travels in Madurai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Samyutha Travels is the best travels in Madurai offering taxi booking and tour services.">
  <link rel="stylesheet" href="style.css">
  <meta name="google-site-verification" content="911Ale-MXYcQ846t2oubWGGE0k-vat2PmZrzNiWAgyQ" />
</head>

<body>

  <header>
    <div class="logo">Samyutha <span>Travels</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Taxi</a>
      <a href="#">Trips</a>
      <a href="#">Tours</a>
      <a href="login.html" class="btn">Login</a>
    </nav>

  </header>

  <main>
    <section class="hero">
    <h1>Plan Your Perfect Trip</h1>

    <div class="search-box">
      <label for="from" class="visually-hidden" style="display:none;">From</label>
      <input type="text" id="from" placeholder="From" aria-label="From Location">
      <label for="to" class="visually-hidden" style="display:none;">To</label>
      <input type="text" id="to" placeholder="To" aria-label="To Location">
      <label for="date" class="visually-hidden" style="display:none;">Date</label>
      <input type="date" id="date" aria-label="Travel Date">
      <button class="btn" onclick="searchTaxi()">Search</button>
    </div>
  </section>

  <section class="features">
    <div class="card">🚕 Quick Taxi Booking</div>
    <div class="card">🧭 Smart Trip Planning</div>
    <div class="card">🌐 Multi Language</div>
    <div class="card">💳 Secure Booking</div>
  </section>
  </main>

  <footer>
    <p>© 2026 Samyutha Travels | Madurai</p>
  </footer>

  <script>
    function searchTaxi() {
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const date = document.getElementById("date").value;

      if (!from || !to || !date) {
        alert("Please fill all fields");
        return;
      }

      window.location.href =
        `taxi.html?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&date=${date}`;
    }
  </script>
  <button onclick="testBackend()">Test Backend</button>

  <script>
    function testBackend() {
      fetch("http://127.0.0.1:5000/test")
        .then(res => res.json())
        .then(data => alert(data.message))
        .catch(err => alert("Error connecting backend"));
    }
  </script>

</body>

</html>
