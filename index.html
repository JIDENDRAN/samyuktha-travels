<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- SEO -->
  <title>Samyutha Travels | Best Travels in Madurai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Samyutha Travels is the best travels in Madurai offering taxi booking and tour services.">
  <meta name="keywords" content="Taxi Madurai, Travels Madurai, Tour Booking, Cab Service Madurai">
  <meta name="author" content="Samyutha Travels">

  <!-- Google Verification -->
  <meta name="google-site-verification" content="911Ale-MXYcQ846t2oubWGGE0k-vat2PmZrzNiWAgyQ" />

  <!-- ✅ FIXED FAVICON (IMPORTANT) -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="/static/images/logo.jpeg" alt="Samyutha Travels Logo" width="120">
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="#">Taxi</a>
      <a href="#">Trips</a>
      <a href="#">Tours</a>
      <a href="login.html" class="btn">Login</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <section class="hero">
      <h1>Plan Your Perfect Trip</h1>

      <div class="search-box">
        <input type="text" id="from" placeholder="From" aria-label="From Location">
        <input type="text" id="to" placeholder="To" aria-label="To Location">
        <input type="date" id="date" aria-label="Travel Date">
        <button class="btn" onclick="searchTaxi()">Search</button>
      </div>
    </section>

    <!-- FEATURES -->
    <section class="features">
      <div class="card">🚕 Quick Taxi Booking</div>
      <div class="card">🧭 Smart Trip Planning</div>
      <div class="card">🌐 Multi Language</div>
      <div class="card">💳 Secure Booking</div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Samyutha Travels | Madurai</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    function searchTaxi() {
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const date = document.getElementById("date").value;

      if (!from || !to || !date) {
        alert("Please fill all fields");
        return;
      }

      window.location.href =
        `taxi.html?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&date=${date}`;
    }
  </script>

</body>

</html>
